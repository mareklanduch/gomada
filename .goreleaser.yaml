# Release build, run by .github/workflows/release.yml on every merge to main
# that calls for a new version. Everything is cross-compiled on one Linux
# runner; no C compiler is involved.
version: 2

project_name: gomada

builds:
  - id: gomada
    main: ./cmd/gomada
    binary: gomada
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mareklanduch/gomada/internal/version.Version={{ .Version }}
      - -X github.com/mareklanduch/gomada/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/mareklanduch/gomada/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: gomada
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: New
      regexp: '^.*?feat(\([^)]*\))?!?:.+$'
      order: 0
    - title: Fixed
      regexp: '^.*?(fix|perf)(\([^)]*\))?!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'
      - '^ci(\([^)]*\))?:'
      - '^Merge '

release:
  draft: false
  prerelease: auto
