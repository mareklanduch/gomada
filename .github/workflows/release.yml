name: Release

# Every merge to main is checked and, when its commits call for a new
# version, tagged and released with executables for Linux, macOS, and
# Windows. See scripts/next-version.sh for how the version is chosen: a merge
# with only docs, tests, or chores releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is computed from history and tags

      - name: Choose the version
        id: version
        run: echo "next=$(bash scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.version.outputs.next == ''
        run: echo "No feat, fix, or perf commits since the last release; nothing to publish." >> "$GITHUB_STEP_SUMMARY"

      # The release is created here and filled by the build jobs below. They
      # run in the same workflow on purpose: a tag pushed by a workflow does
      # not start other workflows.
      - name: Tag and create the release
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --title "$NEXT" --generate-notes --verify-tag

  build:
    name: Build ${{ matrix.name }}
    needs: tag
    if: needs.tag.outputs.next != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # upload to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux executables are linked against musl, so they run on any
          # distribution. `cross` brings the C toolchain each target needs.
          - { name: linux_amd64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { name: linux_arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { name: linux_armv6, os: ubuntu-latest, target: arm-unknown-linux-musleabihf, cross: true }
          - { name: linux_armv7, os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, cross: true }
          - { name: darwin_amd64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: darwin_arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows_amd64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows_arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
    env:
      NEXT: ${{ needs.tag.outputs.next }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        run: |
          export GOMADA_VERSION="${NEXT#v}"
          export GOMADA_COMMIT="$(git rev-parse --short HEAD)"
          export GOMADA_BUILD_DATE="$(git log -1 --format=%cI)"
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            # cross builds in a container; these are the variables it lets in.
            export CROSS_CONTAINER_OPTS="-e GOMADA_VERSION -e GOMADA_COMMIT -e GOMADA_BUILD_DATE"
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Pack and upload
        run: |
          name="gomada_${NEXT#v}_${{ matrix.name }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/gomada.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/gomada" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          gh release upload "$NEXT" "$archive" "$archive.sha256" --clobber
