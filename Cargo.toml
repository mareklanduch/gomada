[package]
name = "gomada"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A terminal app for TP-Link Omada controllers: an interactive view and a scriptable command line"
license = "MIT"
repository = "https://github.com/mareklanduch/gomada"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
getrandom = "0.3"
hex = "0.4"
humantime = "2"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
rcgen = "0.13"
rqrr = "0.10"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Key derivation is slow without optimization, and the tests do a lot of it.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
